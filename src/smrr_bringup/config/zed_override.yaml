# ZED camera parameter overrides for hardware bringup.
#
# IMU publishing is disabled — the EKF uses wheel odometry only.
# ZED positional tracking / visual odometry is disabled because wheel odometry
# + EKF is the active odom source.
# TF publication from the ZED wrapper remains disabled to avoid conflicts
# with the robot's odom -> base_footprint transform.
---
/**:
    ros__parameters:
        general:
            # Prioritize high RGB publish rate for /zed2_left_camera/image_raw relay.
            grab_resolution: 'VGA'
            grab_frame_rate: 30
            pub_frame_rate: 30.0
        video:
            publish_rgb: true
        sensors:
            sensors_image_sync: false  # Keep image/sensor streams independent as requested
            publish_imu_tf: true       # Publish IMU→camera TF so EKF can transform IMU data
            publish_imu: true          # ZED filtered IMU consumed by EKF (/zed2/zed_node/imu/data)
            publish_imu_raw: false     # Raw IMU not needed
        depth:
            # Keep high depth quality, but cap cloud rate to reduce load.
            depth_mode: 'NEURAL_PLUS'
            point_cloud_freq: 5.0
            point_cloud_res: 'COMPACT'
            publish_point_cloud: true
            publish_depth_map: true
            publish_depth_info: true
        pos_tracking:
            pos_tracking_enabled: false # Disable ZED visual odometry/pose tracking
            pos_tracking_mode: 'GEN_1'
            set_as_static: true         # Keep camera treated as static if tracking is re-enabled
            imu_fusion: false
            publish_tf: false           # EKF node publishes odom->base_footprint TF; disable ZED's odom TF
            publish_map_tf: false       # Disable map->odom TF from ZED wrapper
        debug:
            use_pub_timestamps: true    # Stamp messages with ROS/system time instead of camera hardware timestamps
