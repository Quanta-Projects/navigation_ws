controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: false  # Hardware mode

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
          
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50
    
diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]  
    right_wheel_names: ["right_wheel_joint"]  

    # CALIBRATED: Corrected wheel parameters based on odometry testing
    wheel_separation: 0.47  # Measured wheel separation
    wheel_radius: 0.085    # Measured wheel radius

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    odom_frame_id: odom
    base_frame_id: base_footprint

    publish_rate: 100.0  
    pose_covariance_diagonal: [0.05, 0.05, 99999.0, 99999.0, 99999.0, 0.1]
    twist_covariance_diagonal: [0.1, 0.1, 99999.0, 99999.0, 99999.0, 0.2]

    # Fixed: Changed to VELOCITY feedback mode
    position_feedback: false  # Use velocity feedback from encoders
    open_loop: false  # Enable closed-loop control with encoder feedback

    # Velocity command limits
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0

    # Acceleration limits (disabled for now - causing instability)
    # linear.x.max_acceleration: 0.5
    # linear.x.min_acceleration: -0.5
    # angular.z.max_acceleration: 1.0
    # angular.z.min_acceleration: -1.0

    # Velocity command timeout
    cmd_vel_timeout: 0.5  # seconds

    # Enable odometry publishing
    enable_odom_tf: true
