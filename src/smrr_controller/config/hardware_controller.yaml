controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: false  # Hardware mode

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
          
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50
    
diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]  
    right_wheel_names: ["right_wheel_joint"]  

    # CALIBRATED: Corrected wheel parameters based on odometry testing
    wheel_separation: 0.465  # Measured wheel separation
    wheel_radius: 0.084    # Measured wheel radius

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    odom_frame_id: odom
    base_frame_id: base_footprint

    publish_rate: 50.0  # FIXED: Matches controller_manager update_rate
    pose_covariance_diagonal: [0.05, 0.05, 99999.0, 99999.0, 99999.0, 0.1]
    twist_covariance_diagonal: [0.1, 0.1, 99999.0, 99999.0, 99999.0, 0.2]

    position_feedback: false  
    open_loop: false  

    # FIXED: Added required boolean flags for limits to actually apply
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 2.0  # Re-enabled to prevent wheel slip!
    linear.x.min_acceleration: -2.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 2.0  # Re-enabled to prevent wheel slip!
    angular.z.min_acceleration: -2.0

    cmd_vel_timeout: 0.5  

    enable_odom_tf: true  # EKF (robot_localization) publishes odom -> base_footprint TF