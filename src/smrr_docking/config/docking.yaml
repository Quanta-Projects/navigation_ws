docking_server:
  ros__parameters:
    # General parameters
    use_sim_time: false
    controller_frequency: 100.0
    initial_perception_timeout: 10.0
    wait_charge_timeout: 20.0
    dock_approach_timeout: 30.0
    undock_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    rotation_angular_tolerance: 0.05
    max_retries: 3

    # Motion limits
    max_linear_speed: 0.15
    max_angular_speed: 0.3

    # Frames
    base_frame: "base_link"
    fixed_frame: "odom"
    odom_topic: "odom"
    odom_duration: 0.3

    # Misc
    dock_backwards: true         # Humble-era flag; keep true for backward docking
    dock_prestaging_tolerance: 0.1
    introspection_mode: "disabled"

    # Dock plugins
    dock_plugins: ['simple_dock']
    simple_dock:
      plugin: 'opennav_docking::SimpleChargingDock'

      # Docking behaviour
      docking_threshold: 0.3         # stop positional control 4 cm from dock to avoid 1/r singularity
      dock_direction: "backward"      # your intent is to back into the dock
      rotate_to_dock: false           # ignored on Humble, but OK to leave

      # Staging pose configuration (relative to dock pose)
      # For "backward" docking: staging pose should be in front of the dock,
      # with the robot's BACK facing the dock.
      staging_x_offset: 2.5          # tuned so staging pose is where you want it
      staging_yaw_offset: 0.0
      use_staging_pose: true
      navigate_to_staging_pose: true

      # Perception input
      use_external_detection_pose: true
      external_detection_pose_topic: "/detected_dock_pose"
      external_detection_timeout: 2.0   # OK, can increase later if needed

      # Offset from detected pose to actual docking pose.
      # x: negative pushes target 1 cm deeper into dock (toward wall)
      # y: negative shifts target to robot's right; flip sign if alignment gets worse
      external_detection_translation_x: -0.20
      external_detection_translation_y: 0.0
      external_detection_translation_z: 0.0

      # Orientation offsets applied by the docking server to the received pose.
      # tf_to_pose.py sources dock_link, which already has the full tag->dock
      # rotation baked in via the static TF (pitch=-π/2, yaw=-π/2).
      # Applying another rotation here would double-rotate and introduce heading error.
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0

      filter_coef: 0.1              # 0=take new, 1=frozen; higher smooths out close-range AprilTag orientation noise

      # TEMP: keep detection always on while debugging
      detector_service_name: ""        # disable toggle
      detector_service_timeout: 0.0
      subscribe_toggle: false          # always subscribed to topic

      # Success/contact signals
      # SimpleChargingDock hardcodes the subscription to 'battery_state' (relative
      # topic) — the battery_topic parameter does not exist in this build.
      # In docking_bringup.launch.py we remap battery_state -> /dock_confirmed.
      # dock_confirm_node subscribes to /battery_state and only publishes to
      # /dock_confirmed after charging current > charging_threshold has been held
      # continuously for settle_time seconds, preventing premature docking success.
      use_battery_status: true
      charging_threshold: 0.5

      use_stall_detection: false
      joint_states_topic: "/joint_states"
      stall_effort_threshold: 0.6

    # Dock instances
    docks: ['home_dock']
    home_dock:
      type: 'simple_dock'
      frame: "map"
      pose: [-9.49197, -2.4938, 1.29]         #[-7.866, 20.6802, 1.138]
      id: 'home'

    # Docking controller
    controller:
      k_phi: 6.0               # higher value forces robot to start correcting heading immediately from staging pose
      k_delta: 3.0              # increased from 1.5: amplifies curvature at ALL distances; +33% at r=1.6m, +41% at r=0.6m
      beta: 0.1                 # added explicitly (default was 0.4): less speed drop during arcs → higher v_angular for same κ
      lambda: 2.0               # default, set explicitly
      v_linear_min: 0.01
      v_linear_max: 0.11
      v_angular_max: 0.45        # min turning radius = v_linear_max/v_angular_max = 0.1/0.4 = 0.25m
      slowdown_radius: 0.70     # robot starts slowing at 50cm: at r=0.32m v_linear=0.064m/s vs 0.1 before → v_angular drops 36%
      rotate_to_heading_angular_vel: 0.02
      rotate_to_heading_max_angular_accel: 0.5
      use_collision_detection: false
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 1.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.05