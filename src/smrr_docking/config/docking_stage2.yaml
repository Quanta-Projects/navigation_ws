/stage2/docking_server:
  ros__parameters:
    # === Stage 2: fine approach — from 3/5-point (0.64 m) to full contact ===
    # Low k_phi / k_delta: no aggressive corrections at close range.
    # Battery charging current confirms successful physical contact with dock.
    use_sim_time: false
    controller_frequency: 50.0
    initial_perception_timeout: 10.0
    wait_charge_timeout: 20.0
    dock_approach_timeout: 30.0
    undock_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    rotation_angular_tolerance: 0.05
    max_retries: 3

    # Motion limits
    max_linear_speed: 0.15
    max_angular_speed: 0.3

    # Frames
    base_frame: "base_link"
    fixed_frame: "odom"
    odom_topic: "/odom"           # absolute topic — node lives in /stage2/ namespace
    odom_duration: 0.3

    # Misc
    dock_backwards: true
    # Robot is ~0.64 m from dock after Stage 1; staging pose here is 0.68 m from dock.
    # Difference ≈ 0.04 m → well within prestaging tolerance → Nav2 navigation skipped.
    dock_prestaging_tolerance: 0.15
    introspection_mode: "disabled"

    # Dock plugins
    dock_plugins: ['simple_dock']
    simple_dock:
      plugin: 'opennav_docking::SimpleChargingDock'

      # Full contact threshold — battery status is the primary success signal
      docking_threshold: 0.05
      dock_direction: "backward"
      rotate_to_dock: false

      # Short staging offset: robot already at ~0.64 m from dock after Stage 1.
      # 0.68 m keeps the staging pose just beyond the robot's current position.
      staging_x_offset: 0.68
      staging_yaw_offset: 0.0
      use_staging_pose: true
      navigate_to_staging_pose: false   # robot already near dock; skip Nav2

      # Perception input
      use_external_detection_pose: true
      external_detection_pose_topic: "/detected_dock_pose"
      external_detection_timeout: 2.0
      external_detection_translation_x: -0.14
      external_detection_translation_y: -0.03
      external_detection_translation_z: 0.0
      external_detection_rotation_roll: -1.5707963
      external_detection_rotation_pitch: 1.5707963
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.6
      detector_service_name: ""
      detector_service_timeout: 0.0
      subscribe_toggle: false

      # Confirm docking via battery charging current
      use_battery_status: true
      battery_topic: "/battery_state"
      charging_threshold: 0.2
      use_stall_detection: false
      joint_states_topic: "/joint_states"
      stall_effort_threshold: 0.6

    # Dock instances
    docks: ['home_dock']
    home_dock:
      type: 'simple_dock'
      frame: "map"
      pose: [-9.49197, -2.4938, 1.281184]
      id: 'home'

    # Docking controller — LOW gains for smooth, gentle final approach
    controller:
      k_phi: 0.8               # LOW (was 1.5/3.0) — gentle heading correction at close range
      k_delta: 0.6             # LOW (was 1.0/2.5) — smooth path during final 0.64 m
      beta: 0.2
      lambda: 2.0
      v_linear_min: 0.01
      v_linear_max: 0.12
      v_angular_max: 0.4
      slowdown_radius: 0.70
      rotate_to_heading_angular_vel: 0.02
      rotate_to_heading_max_angular_accel: 0.5
      use_collision_detection: false
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 1.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.05
