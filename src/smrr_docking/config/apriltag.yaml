apriltag_node:
  ros__parameters:
    # setup (defaults)
    image_transport: raw  # image format
    family: 36h11         # UPDATED: Set to 36h11 (Standard Tag36h11)
    size: 0.2          # IMPORTANT: Change this to your tag's printed size in meters!
    profile: false

    # tuning of detection
    max_hamming: 2
    detector:
      threads: 4
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false

    pose_estimation_method: "pnp"

    publish_tf: true
    approximate_sync: true

    # (optional) list of tags
    # If you want to track specific tags, uncomment and fill this:
    # tag:
    #   ids:    [1, 2]
    #   frames: [tag_1_frame, tag_2_frame]
    #   sizes:  [0.15, 0.15]